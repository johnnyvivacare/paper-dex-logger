name: opportunity-paper
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: logger
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure commits
        run: |
          git config user.name "paper-logger"
          git config user.email "paper-logger@users.noreply.github.com"
      - name: Eight opportunity checks targeting 30 seconds
        shell: python
        run: |
          import subprocess
          import time
          def run(*args):
              subprocess.run(args, check=True, timeout=120)
          for cycle in range(8):
              started = time.monotonic()
              run("python3", "opportunity.py")
              run("git", "add", "opportunity-data")
              diff = subprocess.run(["git", "diff", "--cached", "--quiet"], timeout=30)
              if diff.returncode == 1:
                  run("git", "commit", "-m", "Save opportunity paper cycle")
                  run("git", "pull", "--rebase", "origin", "main")
                  run("git", "push", "origin", "HEAD:main")
              elif diff.returncode != 0:
                  raise RuntimeError("Could not check changes")
              if cycle < 7:
                  time.sleep(max(0, 30-(time.monotonic()-started)))
