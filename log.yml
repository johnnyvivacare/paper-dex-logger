name: paper-dex-logger
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: logger
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: cycle (public DexScreener data only; nothing here can trade)
        run: python3 dexlog.py cycle --jsonl data
      - name: commit the new rows
        run: |
          git config user.name  "paper-logger"
          git config user.email "paper-logger@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "cycle $(date -u +%FT%TZ)"
          git pull --rebase
          git push
